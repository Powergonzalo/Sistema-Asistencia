.iso-cube{position:absolute;width:40px;height:46px;z-index:1;}
.iso-cube .face{position:absolute;width:23px;height:23px;}
.iso-cube .top{background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(226,100,90,.25));transform:rotate(-30deg) skewX(-25deg) scaleY(.864);top:0;left:9px;border-radius:2px;}
.iso-cube .left{background:linear-gradient(135deg,rgba(226,100,90,.4),rgba(0,0,0,.25));transform:skewY(30deg);top:20px;left:0;border-radius:1px;}
.iso-cube .right{background:linear-gradient(135deg,rgba(226,100,90,.25),rgba(0,0,0,.4));transform:skewY(-30deg);top:20px;left:16px;border-radius:1px;}
.k1{top:8%;left:6%;animation:floatA 7s ease-in-out infinite,glowA 12s linear infinite;}
.k2{top:14%;right:8%;animation:floatB 6.5s ease-in-out infinite,glowB 10s linear infinite;}
.k3{bottom:10%;right:5%;animation:floatA 8.5s ease-in-out infinite .4s,glowA 14s linear infinite;transform:scale(1.4);}
.k4{bottom:16%;left:10%;animation:floatB 5.8s ease-in-out infinite .2s,glowB 9s linear infinite;transform:scale(.7);}
.k5{top:48%;left:2%;animation:floatA 9s ease-in-out infinite .7s,glowA 11s linear infinite;transform:scale(.85);}
.k6{top:35%;right:2%;animation:floatB 7.2s ease-in-out infinite .5s,glowB 13s linear infinite;transform:scale(1.15);}
@keyframes floatA{0%,100%{margin-top:0;}50%{margin-top:-20px;}}
@keyframes floatB{0%,100%{margin-top:0;}50%{margin-top:16px;}}
@keyframes glowA{0%{filter:brightness(1);}50%{filter:brightness(1.4);}100%{filter:brightness(1);}}
@keyframes glowB{0%{filter:brightness(1.2);}50%{filter:brightness(.9);}100%{filter:brightness(1.2);}}

<script>
var users=[],logs=[],tareas=[];
var adminPin=localStorage.getItem('ca_admin_pin')||'0000';
var pinBuffer='',apinBuffer='',tpinBuffer='';
var dismissTimer;
var tareaUser=null;
var SHEETS_URL='https://script.google.com/macros/s/AKfycbzcXgNWQjpIz0c7SLc8Sost0JiCJD2AZlue2kRvMMeklNvD990NFdXzlfTzfZLlI4hW/exec';
var sheetPend=JSON.parse(localStorage.getItem('ca_sp')||'[]');

// Firebase
async function waitDB(){if(window.firebaseReady)return;await new Promise(function(r){window.addEventListener('firebaseReady',r,{once:true});});}
async function fbSet(col,id,data){await waitDB();return await window.fsSetDoc(window.fsDoc(window.db,col,id),data,{merge:true});}
async function fbGetAll(col){await waitDB();try{var snap=await window.fsGetDocs(window.fsQuery(window.fsCollection(window.db,col),window.fsOrderBy('timestamp','desc')));return snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});}catch(e){return[];}}
async function fbDelete(col,id){await waitDB();return await window.fsDeleteDoc(window.fsDoc(window.db,col,id));}
function fbListen(col,cb){waitDB().then(function(){var q=window.fsQuery(window.fsCollection(window.db,col),window.fsOrderBy('timestamp','desc'));window.fsOnSnapshot(q,function(snap){cb(snap.docs.map(function(d){return Object.assign({id:d.id},d.data());}));});});}

async function initData(){
  showOverlay(true);
  try{
    var res=await Promise.all([fbGetAll('users'),fbGetAll('logs'),fbGetAll('tareas')]);
    users=res[0];logs=res[1];tareas=res[2];
    fbListen('users',function(d){users=d;});
    fbListen('logs',function(d){logs=d;if(document.getElementById('screen-admin').classList.contains('active')){renderDashboard();if(document.getElementById('aview-estadisticas').classList.contains('active'))renderEstadisticas();}});
    fbListen('tareas',function(d){tareas=d;if(document.getElementById('screen-admin').classList.contains('active')){renderDashboard();if(document.getElementById('aview-estadisticas').classList.contains('active'))renderEstadisticas();}});
  }catch(e){showToast('Error conectando a Firebase');}
  showOverlay(false);
}

function showOverlay(show){
  var el=document.getElementById('loading-overlay');
  if(!el){el=document.createElement('div');el.id='loading-overlay';el.style.cssText='position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:16px;';el.innerHTML='<div style="font-size:40px;">&#127970;</div><div style="font-size:14px;color:var(--text2);">Conectando...</div>';document.body.appendChild(el);}
  el.style.display=show?'flex':'none';
}

// Sheets
async function enviarSheets(data){
  try{
    await fetch(SHEETS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(data)});
    if(sheetPend.length>0)setTimeout(syncSheets,2000);
  }catch(e){
    sheetPend.push({data:data,ts:new Date().toISOString()});
    localStorage.setItem('ca_sp',JSON.stringify(sheetPend));
    actualizarBadgePendientes();
    showToast('Sin conexion - guardado ('+sheetPend.length+' pendientes)');
  }
}

async function syncSheets(){
  if(!navigator.onLine||sheetPend.length===0)return;
  var cola=sheetPend.slice();var ok=0;
  for(var i=0;i<cola.length;i++){
    try{
      await fetch(SHEETS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(cola[i].data)});
      var ts=cola[i].ts;sheetPend=sheetPend.filter(function(p){return p.ts!==ts;});
      localStorage.setItem('ca_sp',JSON.stringify(sheetPend));ok++;
    }catch(e){break;}
  }
  actualizarBadgePendientes();
  if(ok>0)showToast(ok+' registros sincronizados');
}

function actualizarBadgePendientes(){
  var b=document.getElementById('conexion-badge');if(!b)return;
  if(sheetPend.length>0){b.textContent='&#9888; '+sheetPend.length+' pendientes';b.style.color='#fde68a';}
  else{b.textContent='&#128994; Firebase';b.style.color='#86efac';}
}

function forzarSyncSheet(){
  if(sheetPend.length===0){showToast('Todo sincronizado');return;}
  showToast('Sincronizando '+sheetPend.length+' registros...');syncSheets();
}

setInterval(syncSheets,30000);
window.addEventListener('online',function(){showToast('Conexion restaurada');syncSheets();});

// ── EXPORTAR ASISTENCIA ──
async function exportarAsistenciaASheet(){
  showConfirm('&#128203; Exportar Asistencia','Se reescribira la hoja Asistencia con todos los datos de Firebase.','Si, exportar',async function(){
    showToast('Exportando asistencia...');
    try{
      await fetch(SHEETS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
        body:JSON.stringify({modo:'batch_asistencia',logs:[...logs].sort(function(a,b){return new Date(a.timestamp)-new Date(b.timestamp);})})
      });
      showToast('Asistencia enviada - revisa el Sheet en 30 seg');
    }catch(e){showToast('Error al exportar asistencia');}
  });
}

// ── EXPORTAR TAREAS ──
async function exportarTareasASheet(){
  showConfirm('&#9881; Exportar Tareas','Se reescribira la hoja Tareas con todos los datos de Firebase.','Si, exportar',async function(){
    showToast('Exportando tareas...');
    try{
      await fetch(SHEETS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
        body:JSON.stringify({modo:'batch_tareas',tareas:[...tareas].sort(function(a,b){return new Date(a.timestamp)-new Date(b.timestamp);})})

      showToast('Tareas enviadas - revisa el Sheet en 30 seg');

// PIN Asistencia
function pressKey(k){if(pinBuffer.length>=4)return;pinBuffer+=k;updateDots('d',pinBuffer);if(pinBuffer.length===4)setTimeout(checkPin,120);}
function deleteKey(){pinBuffer=pinBuffer.slice(0,-1);updateDots('d',pinBuffer);}
function checkPin(){
  var user=users.find(function(u){return u.pin===pinBuffer;});
  if(!user){var h=document.getElementById('pin-hint');h.textContent='PIN incorrecto';h.className='pin-hint error';setTimeout(function(){pinBuffer='';updateDots('d',pinBuffer);h.textContent='Tu PIN es privado y unico';h.className='pin-hint';},1500);return;}
  registerMove(user);
}
function registerMove(user){
  var now=new Date();var hoy=now.toLocaleDateString('es-MX');
  var todayStart=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  var userLogsHoy=logs.filter(function(l){if(l.userId!==user.id)return false;if(l.date===hoy)return true;try{return new Date(l.timestamp).getTime()>=todayStart;}catch(e){return false;}}).sort(function(a,b){return new Date(b.timestamp)-new Date(a.timestamp);});
  var lastHoy=userLogsHoy[0];
  var type;
  if(!lastHoy||lastHoy.type==='Salida'){type='Entrada';}
  else if(lastHoy.type==='Entrada'||lastHoy.type==='Vuelta Almuerzo'){type='Salida';}
  else if(lastHoy.type==='Salida Almuerzo'){showResult('&#9888;',user.name,user.code,'Descanso sin cerrar','Registra tu vuelta del descanso primero');pinBuffer='';updateDots('d',pinBuffer);return;}
  else{type='Salida';}
  if(type==='Salida'){
    var csal=userLogsHoy.filter(function(l){return l.type==='Salida Almuerzo';}).length;
    var cvta=userLogsHoy.filter(function(l){return l.type==='Vuelta Almuerzo';}).length;
    if(csal>cvta){showResult('&#9888;',user.name,user.code,'Descanso sin cerrar','Registra tu vuelta antes de salir');pinBuffer='';updateDots('d',pinBuffer);return;}
  }
  var log={id:Date.now().toString(),userId:user.id,userName:user.name,userCode:user.code,userArea:user.area||'',type:type,date:hoy,time:getHHMM(),timestamp:now.toISOString()};
  logs.unshift(log);fbSet('logs',log.id,log);
  enviarSheets({tipo:'asistencia',fecha:log.date,hora:log.time,nombre:log.userName,codigo:log.userCode,area:log.userArea,tipo_mov:log.type});
  showResult(type==='Entrada'?'&#9989;':'&#128682;',user.name,user.code+(user.area?' - '+user.area:''),type+' registrada',log.date+' - '+log.time);
  pinBuffer='';updateDots('d',pinBuffer);
}

// PIN Almuerzo
function pressAKey(k){if(apinBuffer.length>=4)return;apinBuffer+=k;updateDots('ad',apinBuffer);if(apinBuffer.length===4)setTimeout(checkAPin,120);}
function deleteAKey(){apinBuffer=apinBuffer.slice(0,-1);updateDots('ad',apinBuffer);}
function checkAPin(){
  var user=users.find(function(u){return u.pin===apinBuffer;});
  if(!user){var h=document.getElementById('apin-hint');h.textContent='PIN incorrecto';h.className='pin-hint error';setTimeout(function(){apinBuffer='';updateDots('ad',apinBuffer);h.textContent='Tu PIN es privado y unico';h.className='pin-hint';},1500);return;}
  registerAlmuerzo(user);
}
function registerAlmuerzo(user){
  var now=new Date();var hoy=now.toLocaleDateString('es-MX');
  var todayStart=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  var logsHoy=logs.filter(function(l){if(l.userId!==user.id)return false;if(l.date===hoy)return true;try{return new Date(l.timestamp).getTime()>=todayStart;}catch(e){return false;}}).sort(function(a,b){return new Date(b.timestamp)-new Date(a.timestamp);});
  var tieneEntrada=logsHoy.some(function(l){return l.type==='Entrada';});
  var tieneSalida=logsHoy.some(function(l){return l.type==='Salida';});
  if(!tieneEntrada){showResult('&#9888;',user.name,user.code,'Sin entrada registrada','Primero ficha tu entrada del dia');apinBuffer='';updateDots('ad',apinBuffer);return;}
  if(tieneSalida){showResult('&#9888;',user.name,user.code,'Ya marcaste salida','No podes registrar descanso despues de la salida');apinBuffer='';updateDots('ad',apinBuffer);return;}
  var lastAlm=logsHoy.find(function(l){return l.type==='Salida Almuerzo'||l.type==='Vuelta Almuerzo';});
  var type=(!lastAlm||lastAlm.type==='Vuelta Almuerzo')?'Salida Almuerzo':'Vuelta Almuerzo';
  var log={id:Date.now().toString(),userId:user.id,userName:user.name,userCode:user.code,userArea:user.area||'',type:type,date:hoy,time:getHHMM(),timestamp:now.toISOString()};
  logs.unshift(log);fbSet('logs',log.id,log);
  enviarSheets({tipo:'asistencia',fecha:log.date,hora:log.time,nombre:log.userName,codigo:log.userCode,area:log.userArea,tipo_mov:log.type});
  showResult(type==='Salida Almuerzo'?'&#127374;':'&#9989;',user.name,user.code,type+' registrada',log.date+' - '+log.time);
  apinBuffer='';updateDots('ad',apinBuffer);
}

function switchATab(tab,evt){
  document.querySelectorAll('.aview').forEach(function(v){v.classList.remove('active');});
  document.querySelectorAll('.atab').forEach(function(t){t.classList.remove('active');});
  document.getElementById('aview-'+tab).classList.add('active');
  if(evt&&evt.target)evt.target.classList.add('active');
  else document.querySelectorAll('.atab')[0].classList.add('active');
  if(tab==='historial'){populateFilters();renderHistorial();}
  if(tab==='tareas-hist'){populateTareaFilters();renderTareasHist();}
  if(tab==='exportar'){populateExportSelects();}

}

function getSemana(fechaRef){
  // Devuelve array de 6 fechas (lun-sab) de la semana que contiene fechaRef
  var d = fechaRef ? new Date(fechaRef+'T12:00:00') : new Date();
  var dia = d.getDay(); // 0=dom
  var lunes = new Date(d);
  lunes.setDate(d.getDate() - (dia===0?6:dia-1));
  var dias=[];
  for(var i=0;i<6;i++){
    var dd=new Date(lunes);dd.setDate(lunes.getDate()+i);
    dias.push(dd.toLocaleDateString('es-MX'));
  }
  return dias;
}

function toMin(t){if(!t)return 0;var p=t.split(':').map(Number);return isNaN(p[0])?0:p[0]*60+(p[1]||0);}
function fmtMin(m){if(!m||m<=0)return '-';return Math.floor(m/60)+'h '+(m%60)+'m';}

// --- Asistencia del dia ---
function renderStatsAsistenciaHoy(){
  var filtroFecha=document.getElementById('stats-fecha-asistencia').value;
  var targetDate=filtroFecha?new Date(filtroFecha+'T12:00:00').toLocaleDateString('es-MX'):new Date().toLocaleDateString('es-MX');
  var todayStart=new Date();todayStart.setHours(0,0,0,0);
  var c=document.getElementById('stats-asistencia-hoy');
  if(!users.length){c.innerHTML='<div class="empty"><p>Sin usuarios</p></div>';return;}

  // Calcular datos por usuario para la fecha
  var userData=users.map(function(u){
    var uLogs=logs.filter(function(l){
      if(l.userId!==u.id)return false;
      return l.date===targetDate;
    }).sort(function(a,b){return new Date(a.timestamp)-new Date(b.timestamp);});

    var entrada='',salida='',status='out';
    var salidas=[],vueltas=[],minFuera=0;
    uLogs.forEach(function(l){
      if(l.type==='Entrada'&&!entrada)entrada=l.time;
      if(l.type==='Salida')salida=l.time;
      if(l.type==='Salida Almuerzo')salidas.push(l.time);
      if(l.type==='Vuelta Almuerzo')vueltas.push(l.time);
    });
    // Calcular minutos fuera acumulados
    salidas.forEach(function(sal,i){
      if(vueltas[i]){var m=toMin(vueltas[i])-toMin(sal);if(m>0)minFuera+=m;}
    });
    var last=uLogs[uLogs.length-1];
    if(last){
      if(last.type==='Entrada'||last.type==='Vuelta Almuerzo')status='in';
      else if(last.type==='Salida Almuerzo')status='lunch';
      else status='out';
    }
    var horas='';
    if(entrada&&salida){var m=toMin(salida)-toMin(entrada)-minFuera;if(m>0)horas=fmtMin(m);}
    // Texto columna alm/desc
    var almDesc='';
    if(salidas.length>0){
      almDesc=salidas.length+(salidas.length===1?' salida':' salidas');
      if(minFuera>0)almDesc+='<br><strong style="color:var(--yellow);">'+fmtMin(minFuera)+'</strong>';
      if(status==='lunch'&&salidas.length>vueltas.length)almDesc='<span style="color:var(--yellow);font-weight:600;">Fuera desde '+salidas[salidas.length-1]+'</span>';
    }
    return {u:u,entrada:entrada,salida:salida,almDesc:almDesc,horas:horas,status:status};
  });

  // Build table
  var thStyle='padding:9px 8px;background:var(--accent-light);color:var(--accent);font-size:11px;font-weight:700;text-align:center;border:1px solid var(--border);';
  var html='<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:12px;">';
  html+='<thead><tr>';
  html+='<th style="'+thStyle+'text-align:left;min-width:90px;">Nombre</th>';
  html+='<th style="'+thStyle+'">Entrada</th>';
  html+='<th style="'+thStyle+'">Salida</th>';
  html+='<th style="'+thStyle+'">Alm / Desc</th>';
  html+='<th style="'+thStyle+'">Horas</th>';
  html+='<th style="'+thStyle+'">Estado</th>';
  html+='</tr></thead><tbody>';

  userData.forEach(function(d,i){
    var rowBg=d.status==='in'?'background:#f0fdf4;':d.status==='lunch'?'background:#fffbeb;':d.status==='out'&&d.salida?'background:var(--white);':'background:#fef2f2;';
    var tdBase='padding:9px 8px;border:1px solid var(--border);text-align:center;'+rowBg;
    var badge=d.status==='in'?'<span style="background:#f0fdf4;color:var(--green);border:1px solid #86efac;font-size:10px;font-weight:700;padding:3px 8px;border-radius:var(--radius);">Trabajando</span>':
              d.status==='lunch'?'<span style="background:#fffbeb;color:var(--yellow);border:1px solid #fde68a;font-size:10px;font-weight:700;padding:3px 8px;border-radius:var(--radius);">Descanso</span>':
              d.salida?'<span style="background:var(--surface);color:var(--text2);border:1px solid var(--border);font-size:10px;font-weight:700;padding:3px 8px;border-radius:var(--radius);">Finalizado</span>':
              '<span style="background:#fef2f2;color:var(--red);border:1px solid #fca5a5;font-size:10px;font-weight:700;padding:3px 8px;border-radius:var(--radius);">Ausente</span>';
    html+='<tr>';
    html+='<td style="'+tdBase+'text-align:left;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:90px;">'+d.u.name.split(' ')[0]+(d.u.name.split(' ')[1]?' '+d.u.name.split(' ')[1][0]+'.':'')+'</td>';
    html+='<td style="'+tdBase+'color:var(--green);font-weight:600;">'+(d.entrada||'<span style="color:var(--border);">—</span>')+'</td>';
    html+='<td style="'+tdBase+'color:var(--red);font-weight:600;">'+(d.salida||'<span style="color:var(--border);">—</span>')+'</td>';
    html+='<td style="'+tdBase+'font-size:11px;">'+(d.almDesc||'<span style="color:var(--border);">—</span>')+'</td>';
    html+='<td style="'+tdBase+'font-weight:700;color:var(--accent);">'+(d.horas||'<span style="color:var(--border);">—</span>')+'</td>';
    html+='<td style="'+tdBase+'">'+badge+'</td>';
    html+='</tr>';
  });

  html+='</tbody></table>';
  // Leyenda
  html+='<div style="padding:8px 4px;display:flex;gap:12px;flex-wrap:wrap;">';
  html+='<span style="font-size:11px;color:var(--green);font-weight:600;">● Trabajando</span>';
  html+='<span style="font-size:11px;color:var(--yellow);font-weight:600;">● Descanso</span>';
  html+='<span style="font-size:11px;color:var(--text2);font-weight:600;">● Finalizado</span>';
  html+='<span style="font-size:11px;color:var(--red);font-weight:600;">● Ausente</span>';
  html+='</div></div>';
  c.innerHTML=html;
}

// --- Resumen tareas ---
function renderStatsTareas(){
  var filtroFecha=document.getElementById('stats-fecha-tareas').value;
  var dias=getSemana(filtroFecha);
  var c=document.getElementById('stats-tareas-resumen');
  if(!users.length){c.innerHTML='<div class="empty"><p>Sin usuarios</p></div>';return;}

  var tipos=['colecta','flex','limpieza','etiquetado','inspeccion','laboratorio'];
  var nomCorto={colecta:'Colecta',flex:'Flex',limpieza:'Limpieza',etiquetado:'Etiquet.',inspeccion:'Insp.',laboratorio:'Lab.'};

  // Calcular totales por persona+dia+tipo
  var data={};
  users.forEach(function(u){data[u.id]={};dias.forEach(function(d){data[u.id][d]={};});});
  tareas.filter(function(t){return t.estado==='fin'||t.fin;}).forEach(function(t){
    if(!data[t.userId])return;
    if(!data[t.userId][t.date])return;
    var tipo=t.tipo;
    var cant=0;
    if(tipo==='limpieza')cant=t.total||0;
    else if(tipo==='inspeccion'||tipo==='laboratorio')cant=(t.ok||0)+(t.fail||0);
    else cant=t.despachos||t.cantidad||0;
    data[t.userId][t.date][tipo]=(data[t.userId][t.date][tipo]||0)+cant;
  });

  // Tabla: filas=persona, cols=dia
  var html='<table style="width:100%;border-collapse:collapse;font-size:11px;">';
  // Header fechas
  html+='<tr><th style="'+thS()+'text-align:left;min-width:80px;">Empleado</th>';
  dias.forEach(function(d){
    var parts=d.split('/');var label=parts[0]+'/'+parts[1];
    html+='<th style="'+thS()+'">'+label+'</th>';
  });
  html+='</tr>';

  users.forEach(function(u){
    var hasData=dias.some(function(d){return Object.keys(data[u.id]&&data[u.id][d]||{}).length>0;});
    html+='<tr><td style="'+tdS()+'font-weight:600;text-align:left;">'+u.name.split(' ')[0]+'</td>';
    dias.forEach(function(d){
      var dd=data[u.id]&&data[u.id][d]||{};
      var cell='';
      tipos.forEach(function(tipo){
        if(dd[tipo]>0)cell+='<div style="font-size:10px;color:var(--text2);">'+nomCorto[tipo]+': <strong style="color:var(--text);">'+dd[tipo]+'</strong></div>';
      });
      html+='<td style="'+tdS()+'vertical-align:top;">'+(cell||'<span style="color:var(--border);">-</span>')+'</td>';
    });
    html+='</tr>';
  });
  html+='</table>';
  c.innerHTML=html;
}

// --- Resumen horas ---
function renderStatsHoras(){
  var filtroFecha=document.getElementById('stats-fecha-horas').value;
  var dias=getSemana(filtroFecha);
  var c=document.getElementById('stats-horas-resumen');
  if(!users.length){c.innerHTML='<div class="empty"><p>Sin usuarios</p></div>';return;}

  // Calcular horas por persona+dia
  var data={};
  users.forEach(function(u){data[u.id]={};});

  // Agrupar logs por persona+dia
  var grupos={};
  logs.forEach(function(l){
    var key=l.userId+'_'+l.date;
    if(!grupos[key])grupos[key]={userId:l.userId,date:l.date,entrada:'',salida:'',salAlm:'',vtaAlm:''};
    var g=grupos[key];
    if(l.type==='Entrada'&&!g.entrada)g.entrada=l.time;
    if(l.type==='Salida')g.salida=l.time;
    if(l.type==='Salida Almuerzo'&&!g.salAlm)g.salAlm=l.time;
    if(l.type==='Vuelta Almuerzo'&&!g.vtaAlm)g.vtaAlm=l.time;
  });

  Object.values(grupos).forEach(function(g){
    if(!data[g.userId])return;
    if(g.entrada&&g.salida){
      var m=toMin(g.salida)-toMin(g.entrada);
      if(g.salAlm&&g.vtaAlm)m-=(toMin(g.vtaAlm)-toMin(g.salAlm));
      if(m>0)data[g.userId][g.date]=m;
    }
  });

  var html='<table style="width:100%;border-collapse:collapse;font-size:11px;">';
  html+='<tr><th style="'+thS()+'text-align:left;min-width:80px;">Empleado</th>';
  dias.forEach(function(d){
    var parts=d.split('/');
    html+='<th style="'+thS()+'">'+parts[0]+'/'+parts[1]+'</th>';
  });
  html+='<th style="'+thS()+'">Total</th></tr>';

  users.forEach(function(u){
    var total=0;
    html+='<tr><td style="'+tdS()+'font-weight:600;text-align:left;">'+u.name.split(' ')[0]+'</td>';
    dias.forEach(function(d){
      var m=data[u.id]&&data[u.id][d]||0;
      total+=m;
      var color=m>=480?'var(--green)':m>=360?'var(--yellow)':m>0?'var(--text)':'var(--border)';
      html+='<td style="'+tdS()+'color:'+color+';font-weight:'+(m>0?'700':'400')+';">'+(m>0?fmtMin(m):'-')+'</td>';
    });
    html+='<td style="'+tdS()+'color:var(--accent);font-weight:700;">'+(total>0?fmtMin(total):'-')+'</td>';
    html+='</tr>';
  });
  html+='</table>';
  c.innerHTML=html;
}

function thS(){return 'padding:8px 6px;background:var(--accent-light);color:var(--accent);font-size:10px;font-weight:700;text-align:center;border:1px solid var(--border);';}
function tdS(){return 'padding:8px 6px;border:1px solid var(--border);text-align:center;background:var(--white);font-size:11px;color:var(--text);';}


function renderDashboard(){
  var today=new Date().toLocaleDateString('es-MX');
  var statusMap={};users.forEach(function(u){statusMap[u.id]='out';});
  var logsHoy=logs.filter(function(l){return l.date===today;}).sort(function(a,b){return new Date(a.timestamp)-new Date(b.timestamp);});
  logsHoy.forEach(function(l){
    if(l.type==='Entrada'||l.type==='Vuelta Almuerzo')statusMap[l.userId]='in';
    else if(l.type==='Salida')statusMap[l.userId]='out';
    else if(l.type==='Salida Almuerzo')statusMap[l.userId]='lunch';
  });
  var inC=Object.values(statusMap).filter(function(s){return s==='in';}).length;
  var lC=Object.values(statusMap).filter(function(s){return s==='lunch';}).length;
  var todayT=tareas.filter(function(t){return t.date===today;});
  document.getElementById('stat-in').textContent=inC;
  document.getElementById('stat-lunch').textContent=lC;
  document.getElementById('stat-pedidos').textContent=todayT.filter(function(t){return t.tipo==='colecta'||t.tipo==='flex';}).length;
  document.getElementById('stat-limpiezas').textContent=todayT.filter(function(t){return t.tipo==='limpieza';}).length;
  var sl=document.getElementById('status-list');
  sl.innerHTML=users.length?users.map(function(u){var st=statusMap[u.id]||'out';var bc=st==='in'?'s-in':st==='lunch'?'s-lunch':'s-out';var lb=st==='in'?'Presente':st==='lunch'?'Almuerzo':'Fuera';return '<div class="user-item"><div class="avatar">'+u.name[0]+'</div><div class="user-info"><div class="user-name">'+u.name+'</div><div class="user-meta">'+u.code+'</div></div><span class="status-badge '+bc+'">'+lb+'</span></div>';}).join(''):'<div class="empty"><div class="empty-icon">&#128101;</div><p>Sin usuarios</p></div>';
  var tl=document.getElementById('today-logs');
  tl.innerHTML=logsHoy.length?logsHoy.slice().reverse().map(function(l){return buildLogCard(l);}).join(''):'<div class="empty"><div class="empty-icon">&#128523;</div><p>Sin movimientos hoy</p></div>';
  var tt=document.getElementById('today-tareas');
  tt.innerHTML=todayT.length?todayT.map(function(t){return buildTareaCard(t);}).join(''):'<div class="empty"><div class="empty-icon">&#128523;</div><p>Sin tareas hoy</p></div>';
}

function buildLogCard(l){
  var cls={'Entrada':'entrada','Salida':'salida','Salida Almuerzo':'almuerzo-sal','Vuelta Almuerzo':'almuerzo-vta'}[l.type]||'entrada';
  var bc={'Entrada':'lb-in','Salida':'lb-out','Salida Almuerzo':'lb-lunch','Vuelta Almuerzo':'lb-back'}[l.type]||'lb-in';
  return '<div class="log-item '+cls+'"><div class="log-row"><div class="log-name">'+l.userName+'</div><span class="log-badge '+bc+'">'+l.type+'</span><button class="del-btn" onclick="eliminarLog(\''+l.id+'\')" title="Eliminar">&#128465;</button></div><div class="log-meta">'+l.userCode+' - '+l.time+'</div></div>';
}

function buildTareaCard(t){
  var nom=t.tipo==='colecta'?'Colecta':t.tipo==='flex'?'Flex':t.tipo==='limpieza'?'Limpieza':t.tipo==='etiquetado'?'Etiquetado':t.tipo==='inspeccion'?'Inspeccion':t.tipo==='laboratorio'?'Laboratorio':'Tarea';
  var color=t.tipo==='colecta'||t.tipo==='flex'?'lb-pedidos':t.tipo==='limpieza'?'lb-limpieza':'lb-etiquetado';
  var est=t.estado==='inicio'?'<span style="background:rgba(245,158,11,.2);color:var(--yellow);padding:2px 8px;border-radius:8px;font-size:10px;font-weight:700;">EN CURSO</span>':'<span style="background:rgba(34,197,94,.2);color:var(--green);padding:2px 8px;border-radius:8px;font-size:10px;font-weight:700;">FINALIZADA</span>';
  var horario=t.estado==='inicio'?'Inicio: '+t.inicio:t.inicio+' > '+t.fin;
  return '<div class="log-item pedidos"><div class="log-row"><div class="log-name">'+t.userName+'</div><span class="log-badge '+color+'">'+nom+'</span><button class="del-btn" onclick="eliminarTarea(\''+t.id+'\')" title="Eliminar">&#128465;</button></div><div class="log-meta">'+t.userCode+' - '+t.date+' - '+horario+' '+est+'</div></div>';
}

function renderHistorial(){
  var fu=document.getElementById('f-user').value,fd=document.getElementById('f-date').value,ft=document.getElementById('f-type').value;
  var data=logs.slice();
  if(fu)data=data.filter(function(l){return l.userId===fu;});
  if(ft)data=data.filter(function(l){return l.type===ft;});
  if(fd){var ds=new Date(fd+'T00:00:00').toLocaleDateString('es-MX');data=data.filter(function(l){return l.date===ds;});}
  data.sort(function(a,b){return new Date(b.timestamp)-new Date(a.timestamp);});
  var c=document.getElementById('historial-list');
  c.innerHTML=data.length?data.map(function(l){return buildLogCard(l);}).join(''):'<div class="empty"><div class="empty-icon">&#128269;</div><p>Sin resultados</p></div>';
}

function clearTareaFilters(){['tf-user','tf-date','tf-tipo'].forEach(function(id){document.getElementById(id).value='';});renderTareasHist();}

function addUser(){
  var name=document.getElementById('n-name').value.trim();
  var code=document.getElementById('n-code').value.trim().toUpperCase();
  var area=document.getElementById('n-area').value.trim();
  var pin=document.getElementById('n-pin').value.trim();
  if(!name||!code||!pin){showToast('Nombre, codigo y PIN son requeridos');return;}
  if(!/^\d{4}$/.test(pin)){showToast('El PIN debe ser de 4 digitos');return;}
  if(users.find(function(u){return u.code===code;})){showToast('Ese codigo ya existe');return;}
  if(users.find(function(u){return u.pin===pin;})){showToast('Ese PIN ya esta en uso');return;}
  var user={id:Date.now().toString(),name:name,code:code,area:area,pin:pin,timestamp:new Date().toISOString()};
  users.push(user);fbSet('users',user.id,user);
  ['n-name','n-code','n-area','n-pin'].forEach(function(id){document.getElementById(id).value='';});
  renderUsers();populateFilters();showToast(name+' agregado');
}

function renderUsers(){
  document.getElementById('user-count').textContent=users.length;
  var c=document.getElementById('users-list');
  if(!users.length){c.innerHTML='<div class="empty"><div class="empty-icon">&#128101;</div><p>Sin usuarios</p></div>';return;}
  c.innerHTML=users.map(function(u){
    return '<div class="user-item"><div class="avatar">'+u.name[0]+'</div><div class="user-info"><div class="user-name">'+u.name+'</div><div class="user-meta">'+u.code+(u.area?' - '+u.area:'')+'</div></div><button class="del-btn" onclick="deleteUser(\''+u.id+'\')">&#10005;</button></div>';
  }).join('');

function exportExcel(){
  var data=logs.slice();
  var ed=document.getElementById('ex-date').value,eu=document.getElementById('ex-user').value;
  if(ed){var ds=new Date(ed+'T00:00:00').toLocaleDateString('es-MX');data=data.filter(function(l){return l.date===ds;});}
  if(eu)data=data.filter(function(l){return l.userId===eu;});
  if(!data.length){showToast('Sin registros');return;}
  var grupos={};
  data.sort(function(a,b){return new Date(a.timestamp)-new Date(b.timestamp);}).forEach(function(l){
    var key=l.userId+'_'+l.date;
    if(!grupos[key])grupos[key]={fecha:l.date,nombre:l.userName,codigo:l.userCode,area:l.userArea,entrada:'',salida:'',sal_alm:'',vta_alm:''};
    if(l.type==='Entrada'&&!grupos[key].entrada)grupos[key].entrada=l.time;
    if(l.type==='Salida')grupos[key].salida=l.time;
    if(l.type==='Salida Almuerzo'&&!grupos[key].sal_alm)grupos[key].sal_alm=l.time;
    if(l.type==='Vuelta Almuerzo'&&!grupos[key].vta_alm)grupos[key].vta_alm=l.time;
  });
  function toMin(t){if(!t)return 0;var p=t.split(':').map(Number);return p[0]*60+p[1];}
  var rows=[['Fecha','Nombre','Codigo','Area','Entrada','Salida Almuerzo','Vuelta Almuerzo','Salida','Horas Trabajadas']];
  Object.values(grupos).forEach(function(g){
    var horas='';
    if(g.entrada&&g.salida){var min=toMin(g.salida)-toMin(g.entrada);if(g.sal_alm&&g.vta_alm)min-=(toMin(g.vta_alm)-toMin(g.sal_alm));if(min>0)horas=Math.floor(min/60)+'h '+(min%60)+'m';}
    rows.push([g.fecha,g.nombre,g.codigo,g.area,g.entrada,g.sal_alm,g.vta_alm,g.salida,horas]);
  });
  var wb=XLSX.utils.book_new();var ws=XLSX.utils.aoa_to_sheet(rows);
  XLSX.utils.book_append_sheet(wb,ws,'Asistencia');
  XLSX.writeFile(wb,'asistencia_'+(ed||new Date().toISOString().split('T')[0])+'.xlsx');
  showToast('Excel descargado');
}

function exportTareasExcel(){
  var data=tareas.slice();
  var ed=document.getElementById('tex-date').value,eu=document.getElementById('tex-user').value,et=document.getElementById('tex-tipo').value;
  if(ed){var ds=new Date(ed+'T00:00:00').toLocaleDateString('es-MX');data=data.filter(function(t){return t.date===ds;});}
  if(eu)data=data.filter(function(t){return t.userId===eu;});
  if(et)data=data.filter(function(t){return t.tipo===et;});
  if(!data.length){showToast('Sin registros');return;}
  var rows=[['Fecha','Tarea','Nombre','Codigo','Inicio','Fin','Observacion','Estado']];
  data.forEach(function(t){
    var nom=t.tipo==='colecta'?'Despachos Colecta':t.tipo==='flex'?'Despachos Flex':t.tipo==='limpieza'?'Limpieza de Articulos':t.tipo==='inspeccion'?'Inspeccion de Productos':t.tipo==='laboratorio'?'Laboratorio':'Etiquetado de Productos';
    var obs=t.tipo==='limpieza'&&t.total!=null?'Total: '+t.total+' productos':(t.tipo==='inspeccion'||t.tipo==='laboratorio')&&t.ok!=null?'OK: '+t.ok+' / Fallados: '+(t.fail||0):t.despachos?'Productos: '+t.despachos:t.cantidad?'Productos: '+t.cantidad:'';
    rows.push([t.date,nom,t.userName,t.userCode,t.inicio,t.fin||'',obs,t.estado==='inicio'?'En curso':'Finalizada']);
  });
  var wb=XLSX.utils.book_new();var ws=XLSX.utils.aoa_to_sheet(rows);
  XLSX.utils.book_append_sheet(wb,ws,'Tareas');
  XLSX.writeFile(wb,'tareas_'+(ed||new Date().toISOString().split('T')[0])+'.xlsx');
  showToast('Excel descargado');
}

var confirmCallback=null;
function showConfirm(title,msg,btnLabel,callback){
  document.getElementById('confirm-title').textContent=title;
  document.getElementById('confirm-msg').textContent=msg;
  document.getElementById('confirm-ok').textContent=btnLabel;
  confirmCallback=callback;
  document.getElementById('confirm-overlay').style.display='flex';
}
function closeConfirm(){document.getElementById('confirm-overlay').style.display='none';confirmCallback=null;}
document.getElementById('confirm-ok').addEventListener('click',function(){if(confirmCallback)confirmCallback();closeConfirm();});

var toastT;
function showToast(msg){
  var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},2800);
}
